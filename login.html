<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air Traffic Control Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:#07131f;
}

/* Background */
body::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:
    linear-gradient(rgba(0,255,150,0.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,150,0.08) 1px, transparent 1px);
    background-size:40px 40px;
}

/* Radar */
.radar{
    position:absolute;
    width:600px;
    height:600px;
    border-radius:50%;
    border:2px solid rgba(0,255,150,0.3);
    box-shadow:0 0 40px rgba(0,255,150,0.2);
}

.radar::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:conic-gradient(
        rgba(0,255,150,0.6),
        transparent 70deg
    );
    animation:scan 4s linear infinite;
}

.radar::after{
    content:"";
    position:absolute;
    inset:10%;
    border:1px solid rgba(0,255,150,0.2);
    border-radius:50%;
}

@keyframes scan{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

/* Login Card */
.login-container{
    position:relative;
    z-index:10;
    width:380px;
    padding:40px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 8px 32px rgba(0,0,0,0.4);
    text-align:center;
}

.logo{
    font-size:55px;
    margin-bottom:10px;
}

h1{
    color:#00ff99;
    margin-bottom:5px;
}

.subtitle{
    color:#cfd8dc;
    font-size:14px;
    margin-bottom:30px;
}

/* Inputs */
.input-group{
    margin-bottom:18px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:10px;
    background:rgba(255,255,255,0.1);
    color:white;
    font-size:15px;
}

input::placeholder{
    color:#cfd8dc;
}

/* Button */
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#00ff99;
    color:#07131f;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 20px rgba(0,255,153,0.5);
}

.footer{
    margin-top:20px;
    color:#b0bec5;
    font-size:12px;
    letter-spacing:1px;
}

/* Aircraft Icons */
.aircraft{
    position:absolute;
    color:#00ff99;
    font-size:24px;
    animation:fly 15s linear infinite;
    opacity:0.6;
}

.aircraft:nth-child(1){
    top:10%;
    left:-10%;
}

.aircraft:nth-child(2){
    top:70%;
    left:-15%;
    animation-delay:6s;
}

@keyframes fly{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(130vw);
    }
}
</style>
</head>
<body>

<div class="aircraft">✈</div>
<div class="aircraft">✈</div>

<div class="radar"></div>

<div class="login-container">
    <div class="logo">🛫</div>
    <h1>ATC LOGIN</h1>
    <div class="subtitle">
        Air Traffic Control Management System
    </div>

	<form method="POST" action="login.php">
		<div class="input-group">
			<input type="text"
				   name="username"
				   placeholder="Controller ID"
				   required>
		</div>

		<div class="input-group">
			<input type="password"
				   name="password"
				   placeholder="Password"
				   required>
		</div>

		<button type="submit">LOGIN</button>
	</form>
	
    <div class="footer">
        AIR TRAFFIC OPERATIONS CENTER
    </div>
</div>

</body>
</html>
