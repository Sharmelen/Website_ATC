<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WMSA - Ketua Cawangan Operasi</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#07131f;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Background Grid */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:
    linear-gradient(rgba(0,255,150,.08) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,150,.08) 1px, transparent 1px);
    background-size:40px 40px;
    z-index:-2;
}

/* Radar */
.radar{
    position:absolute;
    width:700px;
    height:700px;
    border-radius:50%;
    border:2px solid rgba(0,255,150,.2);
    box-shadow:0 0 50px rgba(0,255,150,.2);
}

.radar::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:conic-gradient(
        rgba(0,255,150,.5),
        transparent 70deg
    );
    animation:scan 5s linear infinite;
}

@keyframes scan{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

/* Card */
.card{
    position:relative;
    z-index:5;
    width:500px;
    padding:35px;
    text-align:center;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    box-shadow:0 0 30px rgba(0,255,150,.15);
}

.card h1{
    color:#00ff99;
    margin-bottom:25px;
}

.photo{
    width:220px;
    height:280px;
    border-radius:12px;
    object-fit:cover;
    border:4px solid #00ff99;
    margin-bottom:25px;
}

.rank{
    font-size:22px;
    font-weight:bold;
    color:#00ff99;
    margin-bottom:15px;
}

.details{
    font-size:18px;
    line-height:1.8;
}

.back{
    display:inline-block;
    margin-top:30px;
    padding:12px 24px;
    text-decoration:none;
    color:white;
    background:#00aa66;
    border-radius:8px;
    transition:.3s;
}

.back:hover{
    background:#00cc88;
}
</style>

</head>

<body>

<div class="radar"></div>

<div class="card">

<h1>KETUA CAWANGAN OPERASI</h1>

<!-- Replace kco.jpg with your own image -->
<img src="wmlh_kco.jpeg" class="photo" alt="Ketua Cawangan Operasi">

<div class="rank">
MEJ ABDUL YAZIZ BIN<br>
SAAD TUDM
</div>

<div class="details">
Service No: <strong>373501</strong><br>
Position: <strong>Ketua Cawangan Operasi KD Rajawali</strong>
</div>

<a href="login.html" class="back">← Back</a>

</div>

</body>
</html>
